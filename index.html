<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة نظام</title>
<style>
body{
  margin:0;
  height:100vh;
  background: url('bg.jpg') no-repeat center/cover;
  background-color:#000;
  color:#ff3333;
  font-family:'Cairo', 'Courier New', monospace;
  font-size:32px;
  text-align:center;
  text-shadow: 0 0 15px #ff3333, 0 0 30px #ff3333;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
.overlay{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.75);
}
#t{
  position:relative;
  z-index:2;
  padding:20px;
  white-space:pre-wrap;
  direction:rtl;
}
.blink{animation:blink 0.7s infinite}
@keyframes blink{50%{opacity:0}}
.loader{
  display:inline-block;
  width:30px;
  height:30px;
  border:4px solid #ff3333;
  border-top:4px solid transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="overlay"></div>
<div id="t"></div>
<script>
let lines=[
"[! ] جاري تحميل جميع ملفات الجهاز☠️",
"[! ] 💀 تم نقل 32 صوره خاصه الي هاتف مجهول الهويه جاري فحص الثغرات <span class='loader'></span>",
"[! ] جاري اختراق النظام الجهاز...",
"[! ]  👨‍💻تم الحصول علي جميع كلمات السر😈 ",
"[! ]  😈💪الزعيم محمد يمر",
"[! ] ⚠️ تحذير ⚠️",
"يجب الخروج من هذه الصفحة فوراً\nلكي لا تؤذي جهازك",
"[! ] لتجنب المسألة القانونية فقط"
];
let i=0,t=document.getElementById('t');
function type(){
  if(i<lines.length){
    t.innerHTML+=lines[i]+"\\n\\n";
    i++;setTimeout(type,1500);
  }else{
    t.innerHTML+='<span class="blink">_</span>';
  }
}
type();
</script>
</body>
</html>
