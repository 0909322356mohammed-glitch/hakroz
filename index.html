<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Breach</title>
<style>
body{
  margin:0;
  height:100vh;
  background: url('bg.jpg') no-repeat center/cover;
  background-color:#000;
  color:#ff0000;
  font-family:'Courier New', monospace;
  font-size:24px;
  text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000;
  overflow:hidden;
}
.overlay{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.65);
}
#t{
  position:relative;
  z-index:2;
  padding:40px 20px;
  white-space:pre-wrap;
}
.blink{animation:blink 0.7s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="overlay"></div>
<div id="t"></div>
<script>
let lines=[
"[!] UNAUTHORIZED ACCESS DETECTED",
"[!] BYPASSING FIREWALL...",
"[!] ACCESS GRANTED",
"[!] EXTRACTING FILES...",
"[!] SYSTEM COMPROMISED",
"[!] THIS IS A SIMULATION ONLY"
];
let i=0,t=document.getElementById('t');
function type(){
  if(i<lines.length){
    t.innerHTML+=lines[i]+"\\n";
    i++;setTimeout(type,1100);
  }else{
    t.innerHTML+='<span class="blink">_</span>';
  }
}
type();
</script>
</body>
</html>
